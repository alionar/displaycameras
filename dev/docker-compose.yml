services:
  displaycameras-dev:
    build:
      context: .
      platforms:
        - linux/arm64
    platform: linux/arm64
    container_name: displaycameras-dev
    privileged: true                  # needed for /var/run and process management
    ports:
      - "6080:6080"                   # noVNC → open http://localhost:6080/vnc.html
    volumes:
      - ./scripts/displaycameras:/usr/bin/displaycameras    # live edit — no rebuild needed
      - ./scripts/mpv_ipccontrol:/usr/bin/mpv_ipccontrol    # live edit — no rebuild needed
      - ./scripts/rotatedisplays:/usr/bin/rotatedisplays    # live edit — no rebuild needed
      - ./config:/etc/displaycameras                        # live edit config
      - ./tests:/tests                                      # live edit tests
      - ./logs:/var/log/displaycameras                      # persist logs on host
    environment:
      - DISPLAY=:0
    # Use host network so container can reach cameras at 192.168.68.x
    network_mode: host
    stdin_open: true
    tty: true
